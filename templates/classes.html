{% extends "base.html" %}
{% block title %}클래스 목록 · 클래스로 마켓{% endblock %}
{% block content %}
<h1>클래스 목록</h1>
<form class="filters" method="get" action="/classes">
  <label>카테고리
    <select name="category">
      <option value="">전체</option>
      {% for cat in categories %}
      <option value="{{ cat }}" {% if cat == category %}selected{% endif %}>{{ cat }}</option>
      {% endfor %}
    </select>
  </label>
  <label>정렬
    <select name="sort">
      <option value="">기본</option>
      <option value="price" {% if sort == 'price' %}selected{% endif %}>가격 낮은 순</option>
      <option value="rating" {% if sort == 'rating' %}selected{% endif %}>평점 높은 순</option>
    </select>
  </label>
  <button type="submit">적용</button>
</form>
{% if classes %}
<div class="grid">
  {% for c in classes %}{% include "_card.html" %}{% endfor %}
</div>
{% else %}
<p class="empty">조건에 맞는 클래스가 없어요</p>
{% endif %}
{% endblock %}
